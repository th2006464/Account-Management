<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARCHINA 日志查看器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; }
.header { background: #16213e; padding: 16px 24px; border-bottom: 2px solid #0f3460; display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 18px; color: #e94560; }
.header span { font-size: 12px; color: #666; }

.container { max-width: 1200px; margin: 0 auto; padding: 24px; }

/* 上传区 */
.drop-zone { border: 2px dashed #0f3460; border-radius: 12px; padding: 40px; text-align: center; cursor: pointer; transition: all .3s; background: #16213e; margin-bottom: 20px; }
.drop-zone:hover, .drop-zone.drag-over { border-color: #e94560; background: #1a1a40; }
.drop-zone svg { width: 48px; height: 48px; margin-bottom: 12px; fill: #0f3460; }
.drop-zone p { color: #888; font-size: 14px; }
.drop-zone .highlight { color: #e94560; }

/* 文件信息条 */
.file-info { display: none; align-items: center; gap: 12px; padding: 12px 16px; background: #16213e; border-radius: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.file-info.show { display: flex; }
.file-info .name { font-weight: bold; color: #e94560; font-size: 14px; }
.file-info .meta { color: #888; font-size: 12px; }
.file-info .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.badge-json { background: #e94560; color: #fff; }
.badge-text { background: #0f3460; color: #fff; }
.file-info .btn { margin-left: auto; }

/* 按钮 */
.btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all .2s; }
.btn-primary { background: #e94560; color: #fff; }
.btn-primary:hover { background: #ff6b81; }
.btn-outline { background: transparent; border: 1px solid #0f3460; color: #ccc; }
.btn-outline:hover { border-color: #e94560; color: #e94560; }
.btn-sm { padding: 4px 12px; font-size: 11px; }

/* 工具栏 */
.toolbar { display: none; align-items: center; gap: 8px; padding: 8px 0; margin-bottom: 8px; flex-wrap: wrap; }
.toolbar.show { display: flex; }
.toolbar .search { flex: 1; min-width: 200px; padding: 8px 12px; border-radius: 6px; border: 1px solid #0f3460; background: #16213e; color: #e0e0e0; font-size: 13px; outline: none; }
.toolbar .search:focus { border-color: #e94560; }
.toolbar .stats { font-size: 12px; color: #888; white-space: nowrap; }

/* 内容区 */
.content-area { display: none; background: #0d1117; border: 1px solid #0f3460; border-radius: 8px; overflow: hidden; }
.content-area.show { display: block; }
.content-area pre { padding: 16px; margin: 0; font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; font-size: 13px; line-height: 1.6; overflow-x: auto; max-height: 70vh; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
.content-area .line { display: flex; }
.content-area .line:hover { background: rgba(233,69,96,.08); }
.content-area .line-num { color: #444; min-width: 48px; text-align: right; padding-right: 16px; user-select: none; flex-shrink: 0; }

/* JSON 高亮 */
.json-key   { color: #79c0ff; }
.json-str   { color: #a5d6ff; }
.json-num   { color: #ffab70; }
.json-bool  { color: #ff7b72; }
.json-null  { color: #8b949e; }

/* 错误提示 */
.error-box { display: none; padding: 12px 16px; background: #3d1a1a; border: 1px solid #e94560; border-radius: 8px; color: #ff6b81; font-size: 13px; margin-bottom: 16px; }
.error-box.show { display: block; }

.empty-state { text-align: center; padding: 60px 20px; color: #444; }
.empty-state svg { width: 60px; height: 60px; margin-bottom: 16px; fill: #222; }
</style>
</head>
<body>

<div class="header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#e94560"><path d="M20 6h-8l-3-3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
    <h1>GARCHINA 日志查看器</h1>
    <span>— 离线解密 .dat 文件</span>
</div>

<div class="container">

    <div class="drop-zone" id="dropZone">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        <p>拖拽 <span class="highlight">.dat</span> 文件到此处，或 <span class="highlight">点击选择</span></p>
        <input type="file" id="fileInput" accept=".dat" style="display:none">
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="file-info" id="fileInfo">
        <span class="name" id="fileName">—</span>
        <span class="meta" id="fileSize">—</span>
        <span class="badge badge-text" id="fileType">文本</span>
        <button class="btn btn-sm btn-outline" id="copyBtn">&#128203; 复制全文</button>
        <button class="btn btn-sm btn-outline" id="clearBtn">&#10005; 关闭</button>
    </div>

    <div class="toolbar" id="toolbar">
        <input type="text" class="search" id="searchInput" placeholder="搜索过滤...">
        <span class="stats" id="stats">—</span>
    </div>

    <div class="content-area" id="contentArea">
        <pre id="contentPre"></pre>
    </div>

    <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        <p>所有解密操作均在本地浏览器中完成，文件不会上传到任何服务器</p>
    </div>

</div>

<script>
// ═══════════════════════════════════════════
// MD5 实现（Web Crypto API 不支持 MD5）
// ═══════════════════════════════════════════
function md5(string) {
    function r(n,c){return(n<<c)|(n>>>(32-c));}
    function q(n){var c="";for(var i=0;i<4;i++)c+=("0"+(n>>>i*8&255).toString(16)).slice(-2);return c;}
    var x=[],k,AA,BB,CC,DD,a,b,c,d;
    var l=string.length*8;
    x[((l+64>>>9)<<4)+14]=string.length;
    for(var i=0;i<string.length;i++)x[i>>2]|=(string.charCodeAt(i)&255)<<(i%4<<3);
    x[i>>2]|=0x80<<(i%4<<3);
    var S11=7,S12=12,S13=17,S14=22,S21=5,S22=9,S23=14,S24=20,S31=4,S32=11,S33=16,S34=23,S41=6,S42=10,S43=15,S44=21;
    function FF(a,b,c,d,x,s,ac){a+=(b&c|~b&d)+x+ac;a=r(a,s)+b;return a;}
    function GG(a,b,c,d,x,s,ac){a+=(b&d|c&~d)+x+ac;a=r(a,s)+b;return a;}
    function HH(a,b,c,d,x,s,ac){a+=(b^c^d)+x+ac;a=r(a,s)+b;return a;}
    function II(a,b,c,d,x,s,ac){a+=(c^(b|~d))+x+ac;a=r(a,s)+b;return a;}
    a=0x67452301;b=0xEFCDAB89;c=0x98BADCFE;d=0x10325476;
    for(k=0;k<x.length;k+=16){
        AA=a;BB=b;CC=c;DD=d;
        a=FF(a,b,c,d,x[k+0],S11,0xD76AA478);d=FF(d,a,b,c,x[k+1],S12,0xE8C7B756);c=FF(c,d,a,b,x[k+2],S13,0x242070DB);b=FF(b,c,d,a,x[k+3],S14,0xC1BDCEEE);
        a=FF(a,b,c,d,x[k+4],S11,0xF57C0FAF);d=FF(d,a,b,c,x[k+5],S12,0x4787C62A);c=FF(c,d,a,b,x[k+6],S13,0xA8304613);b=FF(b,c,d,a,x[k+7],S14,0xFD469501);
        a=FF(a,b,c,d,x[k+8],S11,0x698098D8);d=FF(d,a,b,c,x[k+9],S12,0x8B44F7AF);c=FF(c,d,a,b,x[k+10],S13,0xFFFF5BB1);b=FF(b,c,d,a,x[k+11],S14,0x895CD7BE);
        a=FF(a,b,c,d,x[k+12],S11,0x6B901122);d=FF(d,a,b,c,x[k+13],S12,0xFD987193);c=FF(c,d,a,b,x[k+14],S13,0xA679438E);b=FF(b,c,d,a,x[k+15],S14,0x49B40821);
        a=GG(a,b,c,d,x[k+1],S21,0xF61E2562);d=GG(d,a,b,c,x[k+6],S22,0xC040B340);c=GG(c,d,a,b,x[k+11],S23,0x265E5A51);b=GG(b,c,d,a,x[k+0],S24,0xE9B6C7AA);
        a=GG(a,b,c,d,x[k+5],S21,0xD62F105D);d=GG(d,a,b,c,x[k+10],S22,0x2441453);c=GG(c,d,a,b,x[k+15],S23,0xD8A1E681);b=GG(b,c,d,a,x[k+4],S24,0xE7D3FBC8);
        a=GG(a,b,c,d,x[k+9],S21,0x21E1CDE6);d=GG(d,a,b,c,x[k+14],S22,0xC33707D6);c=GG(c,d,a,b,x[k+3],S23,0xF4D50D87);b=GG(b,c,d,a,x[k+8],S24,0x455A14ED);
        a=GG(a,b,c,d,x[k+13],S21,0xA9E3E905);d=GG(d,a,b,c,x[k+2],S22,0xFCEFA3F8);c=GG(c,d,a,b,x[k+7],S23,0x676F02D9);b=GG(b,c,d,a,x[k+12],S24,0x8D2A4C8A);
        a=HH(a,b,c,d,x[k+5],S31,0xFFFA3942);d=HH(d,a,b,c,x[k+8],S32,0x8771F681);c=HH(c,d,a,b,x[k+11],S33,0x6D9D6122);b=HH(b,c,d,a,x[k+0],S34,0xFDE5380C);
        a=HH(a,b,c,d,x[k+14],S31,0xA4BEEA44);d=HH(d,a,b,c,x[k+7],S32,0x4BDECFA9);c=HH(c,d,a,b,x[k+10],S33,0xF6BB4B60);b=HH(b,c,d,a,x[k+13],S34,0xBEBFBC70);
        a=HH(a,b,c,d,x[k+3],S31,0x289B7EC6);d=HH(d,a,b,c,x[k+12],S32,0xEAA127FA);c=HH(c,d,a,b,x[k+15],S33,0xD4EF3085);b=HH(b,c,d,a,x[k+2],S34,0x4881D05);
        a=HH(a,b,c,d,x[k+9],S31,0xD9D4D039);d=HH(d,a,b,c,x[k+4],S32,0xE6DB99E5);c=HH(c,d,a,b,x[k+1],S33,0x1FA27CF8);b=HH(b,c,d,a,x[k+8],S34,0xC4AC5665);
        a=II(a,b,c,d,x[k+0],S41,0xF4292244);d=II(d,a,b,c,x[k+7],S42,0x432AFF97);c=II(c,d,a,b,x[k+14],S43,0xAB9423A7);b=II(b,c,d,a,x[k+13],S44,0xFC93A039);
        a=II(a,b,c,d,x[k+12],S41,0x655B59C3);d=II(d,a,b,c,x[k+3],S42,0x8F0CCC92);c=II(c,d,a,b,x[k+10],S43,0xFFEFF47D);b=II(b,c,d,a,x[k+9],S44,0x85845DD1);
        a=II(a,b,c,d,x[k+6],S41,0x6FA87E4F);d=II(d,a,b,c,x[k+15],S42,0xFE2CE6E0);c=II(c,d,a,b,x[k+2],S43,0xA3014314);b=II(b,c,d,a,x[k+5],S44,0x4E0811A1);
        a=II(a,b,c,d,x[k+8],S41,0xF7537E82);d=II(d,a,b,c,x[k+1],S42,0xBD3AF235);c=II(c,d,a,b,x[k+4],S43,0x2AD7D2BB);b=II(b,c,d,a,x[k+11],S44,0xEB86D391);
        a+=AA;b+=BB;c+=CC;d+=DD;
    }
    return q(a)+q(b)+q(c)+q(d);
}

// ═══════════════════════════════════════════
// 密钥和 IV 派生（与 FileProtection.cs 一致）
// ═══════════════════════════════════════════
const KEY_PASSPHRASE = 'GARCHINA@2026#AccountMgmt_SecureKey!';
const IV_PASSPHRASE = 'CN_IT_Support@sinarmas-agri.com';

async function deriveKey() {
    const keyBytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(KEY_PASSPHRASE));
    return await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-CBC' }, false, ['decrypt']);
}

function deriveIv() {
    const hash = md5(IV_PASSPHRASE);
    const bytes = new Uint8Array(16);
    for (let i = 0; i < 16; i++) {
        bytes[i] = parseInt(hash.substr(i * 2, 2), 16);
    }
    return bytes;
}

async function decryptFile(fileBuffer) {
    const key = await deriveKey();
    const iv = deriveIv();
    try {
        const decrypted = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, key, fileBuffer);
        return new TextDecoder('utf-8').decode(decrypted);
    } catch (e) {
        throw new Error('解密失败：文件可能不是有效的加密 .dat 文件，或密钥不匹配');
    }
}

// ═══════════════════════════════════════════
// 格式化
// ═══════════════════════════════════════════
function isJson(str) {
    const trimmed = str.trim();
    return (trimmed.startsWith('[') || trimmed.startsWith('{'));
}

function formatContent(text) {
    if (isJson(text)) {
        try {
            const obj = JSON.parse(text);
            return { type: 'json', html: jsonToHtml(obj), raw: JSON.stringify(obj, null, 2) };
        } catch (e) {}
    }
    return { type: 'text', html: textToHtml(text), raw: text };
}

function jsonToHtml(obj, indent = 0) {
    const pad = '  '.repeat(indent);
    const next = '  '.repeat(indent + 1);

    if (obj === null) return '<span class="json-null">null</span>';
    if (typeof obj === 'boolean') return '<span class="json-bool">' + obj + '</span>';
    if (typeof obj === 'number') return '<span class="json-num">' + obj + '</span>';
    if (typeof obj === 'string') return '<span class="json-str">"' + esc(obj) + '"</span>';

    if (Array.isArray(obj)) {
        if (obj.length === 0) return '[]';
        let html = '[\n';
        obj.forEach((item, i) => {
            html += next + jsonToHtml(item, indent + 1);
            if (i < obj.length - 1) html += ',';
            html += '\n';
        });
        html += pad + ']';
        return html;
    }

    const keys = Object.keys(obj);
    if (keys.length === 0) return '{}';
    let html = '{\n';
    keys.forEach((key, i) => {
        html += next + '<span class="json-key">"' + esc(key) + '"</span>: ' + jsonToHtml(obj[key], indent + 1);
        if (i < keys.length - 1) html += ',';
        html += '\n';
    });
    html += pad + '}';
    return html;
}

function textToHtml(text) {
    const lines = text.split('\n');
    return lines.map((line, i) =>
        '<div class="line"><span class="line-num">' + (i + 1) + '</span>' + esc(line) + '</div>'
    ).join('');
}

function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ═══════════════════════════════════════════
// UI 逻辑
// ═══════════════════════════════════════════
let currentRaw = '';
let currentFiltered = '';

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const errorBox = document.getElementById('errorBox');
const fileInfo = document.getElementById('fileInfo');
const contentArea = document.getElementById('contentArea');
const contentPre = document.getElementById('contentPre');
const toolbar = document.getElementById('toolbar');
const searchInput = document.getElementById('searchInput');
const stats = document.getElementById('stats');
const emptyState = document.getElementById('emptyState');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) processFile(fileInput.files[0]); });

async function processFile(file) {
    errorBox.classList.remove('show');
    errorBox.textContent = '';

    if (!file.name.endsWith('.dat')) {
        showError('请选择 .dat 文件');
        return;
    }

    try {
        const buffer = await file.arrayBuffer();
        const text = await decryptFile(new Uint8Array(buffer));
        currentRaw = text;

        const formatted = formatContent(text);

        // 文件信息
        document.getElementById('fileName').textContent = file.name;
        document.getElementById('fileSize').textContent = formatSize(file.size) + ' · ' + text.split('\n').length + ' 行';
        const typeBadge = document.getElementById('fileType');
        typeBadge.textContent = formatted.type === 'json' ? 'JSON' : '文本';
        typeBadge.className = 'badge ' + (formatted.type === 'json' ? 'badge-json' : 'badge-text');

        // 内容
        contentPre.innerHTML = formatted.html;
        currentFiltered = text;

        // 显示
        fileInfo.classList.add('show');
        toolbar.classList.add('show');
        contentArea.classList.add('show');
        emptyState.style.display = 'none';
        searchInput.value = '';

        updateStats(text);
    } catch (e) {
        showError(e.message);
    }
}

function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
    fileInfo.classList.remove('show');
    toolbar.classList.remove('show');
    contentArea.classList.remove('show');
    emptyState.style.display = 'block';
}

function updateStats(text) {
    const lines = text.split('\n');
    stats.textContent = '共 ' + lines.length + ' 行';
    if (currentFiltered !== text) {
        const filtered = currentFiltered.split('\n');
        stats.textContent += ' · 过滤后 ' + filtered.length + ' 行';
    }
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
}

// 搜索过滤
searchInput.addEventListener('input', () => {
    const q = searchInput.value.toLowerCase();
    if (!q) {
        currentFiltered = currentRaw;
        contentPre.innerHTML = formatContent(currentRaw).html;
        updateStats(currentRaw);
        return;
    }
    const lines = currentRaw.split('\n');
    const filtered = lines.filter(l => l.toLowerCase().includes(q));
    currentFiltered = filtered.join('\n');
    contentPre.innerHTML = textToHtml(currentFiltered);
    updateStats(currentRaw);
});

// 复制全文
document.getElementById('copyBtn').addEventListener('click', async () => {
    await navigator.clipboard.writeText(currentFiltered);
    const btn = document.getElementById('copyBtn');
    const orig = btn.textContent;
    btn.textContent = '✅ 已复制';
    setTimeout(() => btn.textContent = orig, 1500);
});

// 关闭
document.getElementById('clearBtn').addEventListener('click', () => {
    currentRaw = '';
    currentFiltered = '';
    fileInfo.classList.remove('show');
    toolbar.classList.remove('show');
    contentArea.classList.remove('show');
    emptyState.style.display = 'block';
    errorBox.classList.remove('show');
    fileInput.value = '';
});
</script>
</body>
</html>
