<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARCHINA 日志查看器</title>
<link rel="stylesheet" href="https://apps.bdimg.com/libs/bootstrap/3.3.4/css/bootstrap.min.css" />
<style>
body { padding: 20px 0; }
.header { border-bottom: 2px solid #e94560; padding-bottom: 12px; margin-bottom: 20px; }
.header h2 { margin: 0; color: #e94560; }
.header small { color: #999; }

/* 上传区 */
.drop-zone { border: 2px dashed #ddd; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; transition: all .3s; background: #fafafa; margin-bottom: 16px; }
.drop-zone:hover, .drop-zone.drag-over { border-color: #e94560; background: #fff0f0; }
.drop-zone p { color: #999; margin: 8px 0 0; font-size: 14px; }
.drop-zone .highlight { color: #e94560; }

/* 内容区 */
.content-panel { display: none; }
.content-panel.show { display: block; }
.content-panel pre { padding: 12px 16px; margin: 0; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; line-height: 1.5; max-height: 65vh; overflow: auto; white-space: pre-wrap; word-break: break-all; background: #f8f8f8; border: 1px solid #e8e8e8; border-top: none; }
.content-panel .line { display: flex; }
.content-panel .line:hover { background: #fff0f0; }
.content-panel .line-num { color: #ccc; min-width: 42px; text-align: right; padding-right: 14px; user-select: none; flex-shrink: 0; }

/* JSON 高亮 */
.json-key   { color: #881391; }
.json-str   { color: #1a6b1a; }
.json-num   { color: #b85c00; }
.json-bool  { color: #c41a16; }
.json-null  { color: #999; }

/* 元信息 */
.meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.meta-row .label { font-size: 12px; }
</style>
</head>
<body>

<div class="container">

    <div class="header">
        <h2>📁 GARCHINA 日志查看器 <small>— 本地解密 .dat 文件</small></h2>
    </div>

    <div class="alert alert-info" style="font-size:13px;margin-bottom:12px;">
        💡 所有解密操作均在本地浏览器完成，文件不会上传到任何服务器。拖拽或点击下方区域选择文件。
    </div>

    <div class="alert alert-danger" id="errorBox" style="display:none;margin-bottom:12px;"></div>

    <div class="drop-zone" id="dropZone">
        <p style="font-size:20px;">📂</p>
        <p>拖拽 <span class="highlight">.dat</span> 文件到此处，或 <span class="highlight">点击选择</span></p>
        <input type="file" id="fileInput" accept=".dat" style="display:none">
    </div>

    <!-- 文件信息 -->
    <div class="panel panel-default" id="fileInfo" style="display:none;">
        <div class="panel-body" style="padding:8px 12px;">
            <div class="meta-row">
                <strong id="fileName" style="color:#e94560;">—</strong>
                <span class="label label-default" id="fileType">文本</span>
                <small class="text-muted" id="fileSize">—</small>
                <div style="margin-left:auto">
                    <button class="btn btn-default btn-sm" id="copyBtn">📋 复制全文</button>
                    <button class="btn btn-default btn-sm" id="clearBtn">✕ 关闭</button>
                </div>
            </div>
            <div class="input-group input-group-sm">
                <span class="input-group-addon">🔍</span>
                <input type="text" class="form-control" id="searchInput" placeholder="搜索过滤...">
            </div>
            <small class="text-muted" id="stats" style="display:block;margin-top:4px;">—</small>
        </div>
    </div>

    <!-- 内容 -->
    <div class="content-panel" id="contentPanel">
        <pre id="contentPre"></pre>
    </div>

</div>

<script>
// ═══════════════════════════════════════════
// MD5（Web Crypto API 不支持 MD5）
// ═══════════════════════════════════════════
function md5(string) {
    function r(n,c){return(n<<c)|(n>>>(32-c));}
    function q(n){var c="";for(var i=0;i<4;i++)c+=("0"+(n>>>i*8&255).toString(16)).slice(-2);return c;}
    var x=[],k,AA,BB,CC,DD,a,b,c,d;
    var l=string.length*8;
    x[((l+64>>>9)<<4)+14]=string.length;
    for(var i=0;i<string.length;i++)x[i>>2]|=(string.charCodeAt(i)&255)<<(i%4<<3);
    x[i>>2]|=0x80<<(i%4<<3);
    var S11=7,S12=12,S13=17,S14=22,S21=5,S22=9,S23=14,S24=20,S31=4,S32=11,S33=16,S34=23,S41=6,S42=10,S43=15,S44=21;
    function FF(a,b,c,d,x,s,ac){a+=(b&c|~b&d)+x+ac;a=r(a,s)+b;return a;}
    function GG(a,b,c,d,x,s,ac){a+=(b&d|c&~d)+x+ac;a=r(a,s)+b;return a;}
    function HH(a,b,c,d,x,s,ac){a+=(b^c^d)+x+ac;a=r(a,s)+b;return a;}
    function II(a,b,c,d,x,s,ac){a+=(c^(b|~d))+x+ac;a=r(a,s)+b;return a;}
    a=0x67452301;b=0xEFCDAB89;c=0x98BADCFE;d=0x10325476;
    for(k=0;k<x.length;k+=16){
        AA=a;BB=b;CC=c;DD=d;
        a=FF(a,b,c,d,x[k+0],S11,0xD76AA478);d=FF(d,a,b,c,x[k+1],S12,0xE8C7B756);c=FF(c,d,a,b,x[k+2],S13,0x242070DB);b=FF(b,c,d,a,x[k+3],S14,0xC1BDCEEE);
        a=FF(a,b,c,d,x[k+4],S11,0xF57C0FAF);d=FF(d,a,b,c,x[k+5],S12,0x4787C62A);c=FF(c,d,a,b,x[k+6],S13,0xA8304613);b=FF(b,c,d,a,x[k+7],S14,0xFD469501);
        a=FF(a,b,c,d,x[k+8],S11,0x698098D8);d=FF(d,a,b,c,x[k+9],S12,0x8B44F7AF);c=FF(c,d,a,b,x[k+10],S13,0xFFFF5BB1);b=FF(b,c,d,a,x[k+11],S14,0x895CD7BE);
        a=FF(a,b,c,d,x[k+12],S11,0x6B901122);d=FF(d,a,b,c,x[k+13],S12,0xFD987193);c=FF(c,d,a,b,x[k+14],S13,0xA679438E);b=FF(b,c,d,a,x[k+15],S14,0x49B40821);
        a=GG(a,b,c,d,x[k+1],S21,0xF61E2562);d=GG(d,a,b,c,x[k+6],S22,0xC040B340);c=GG(c,d,a,b,x[k+11],S23,0x265E5A51);b=GG(b,c,d,a,x[k+0],S24,0xE9B6C7AA);
        a=GG(a,b,c,d,x[k+5],S21,0xD62F105D);d=GG(d,a,b,c,x[k+10],S22,0x2441453);c=GG(c,d,a,b,x[k+15],S23,0xD8A1E681);b=GG(b,c,d,a,x[k+4],S24,0xE7D3FBC8);
        a=GG(a,b,c,d,x[k+9],S21,0x21E1CDE6);d=GG(d,a,b,c,x[k+14],S22,0xC33707D6);c=GG(c,d,a,b,x[k+3],S23,0xF4D50D87);b=GG(b,c,d,a,x[k+8],S24,0x455A14ED);
        a=GG(a,b,c,d,x[k+13],S21,0xA9E3E905);d=GG(d,a,b,c,x[k+2],S22,0xFCEFA3F8);c=GG(c,d,a,b,x[k+7],S23,0x676F02D9);b=GG(b,c,d,a,x[k+12],S24,0x8D2A4C8A);
        a=HH(a,b,c,d,x[k+5],S31,0xFFFA3942);d=HH(d,a,b,c,x[k+8],S32,0x8771F681);c=HH(c,d,a,b,x[k+11],S33,0x6D9D6122);b=HH(b,c,d,a,x[k+0],S34,0xFDE5380C);
        a=HH(a,b,c,d,x[k+14],S31,0xA4BEEA44);d=HH(d,a,b,c,x[k+7],S32,0x4BDECFA9);c=HH(c,d,a,b,x[k+10],S33,0xF6BB4B60);b=HH(b,c,d,a,x[k+13],S34,0xBEBFBC70);
        a=HH(a,b,c,d,x[k+3],S31,0x289B7EC6);d=HH(d,a,b,c,x[k+12],S32,0xEAA127FA);c=HH(c,d,a,b,x[k+15],S33,0xD4EF3085);b=HH(b,c,d,a,x[k+2],S34,0x4881D05);
        a=HH(a,b,c,d,x[k+9],S31,0xD9D4D039);d=HH(d,a,b,c,x[k+4],S32,0xE6DB99E5);c=HH(c,d,a,b,x[k+1],S33,0x1FA27CF8);b=HH(b,c,d,a,x[k+8],S34,0xC4AC5665);
        a=II(a,b,c,d,x[k+0],S41,0xF4292244);d=II(d,a,b,c,x[k+7],S42,0x432AFF97);c=II(c,d,a,b,x[k+14],S43,0xAB9423A7);b=II(b,c,d,a,x[k+13],S44,0xFC93A039);
        a=II(a,b,c,d,x[k+12],S41,0x655B59C3);d=II(d,a,b,c,x[k+3],S42,0x8F0CCC92);c=II(c,d,a,b,x[k+10],S43,0xFFEFF47D);b=II(b,c,d,a,x[k+9],S44,0x85845DD1);
        a=II(a,b,c,d,x[k+6],S41,0x6FA87E4F);d=II(d,a,b,c,x[k+15],S42,0xFE2CE6E0);c=II(c,d,a,b,x[k+2],S43,0xA3014314);b=II(b,c,d,a,x[k+5],S44,0x4E0811A1);
        a=II(a,b,c,d,x[k+8],S41,0xF7537E82);d=II(d,a,b,c,x[k+1],S42,0xBD3AF235);c=II(c,d,a,b,x[k+4],S43,0x2AD7D2BB);b=II(b,c,d,a,x[k+11],S44,0xEB86D391);
        a+=AA;b+=BB;c+=CC;d+=DD;
    }
    return q(a)+q(b)+q(c)+q(d);
}

// ═══════════════════════════════════════════
// 密钥派生
// ═══════════════════════════════════════════
const KEY_PASSPHRASE = 'GARCHINA@2026#AccountMgmt_SecureKey!';
const IV_PASSPHRASE = 'CN_IT_Support@sinarmas-agri.com';

async function deriveKey() {
    const keyBytes = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(KEY_PASSPHRASE));
    return await crypto.subtle.importKey('raw', keyBytes, { name: 'AES-CBC' }, false, ['decrypt']);
}

function deriveIv() {
    const hash = md5(IV_PASSPHRASE);
    const bytes = new Uint8Array(16);
    for (let i = 0; i < 16; i++) bytes[i] = parseInt(hash.substr(i * 2, 2), 16);
    return bytes;
}

async function decryptFile(fileBuffer) {
    const key = await deriveKey();
    const iv = deriveIv();
    try {
        const decrypted = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: iv }, key, fileBuffer);
        return new TextDecoder('utf-8').decode(decrypted);
    } catch (e) {
        throw new Error('解密失败：文件可能不是有效的加密 .dat 文件，或密钥不匹配');
    }
}

// ═══════════════════════════════════════════
// 格式化
// ═══════════════════════════════════════════
function isJson(str) {
    const t = str.trim();
    return t.startsWith('[') || t.startsWith('{');
}

function formatContent(text) {
    if (isJson(text)) {
        try {
            const obj = JSON.parse(text);
            return { type: 'json', html: jsonToHtml(obj), raw: JSON.stringify(obj, null, 2) };
        } catch (e) {}
    }
    return { type: 'text', html: textToHtml(text), raw: text };
}

function jsonToHtml(obj, indent) {
    indent = indent || 0;
    var pad = '  '.repeat(indent);
    var next = '  '.repeat(indent + 1);

    if (obj === null) return '<span class="json-null">null</span>';
    if (typeof obj === 'boolean') return '<span class="json-bool">' + obj + '</span>';
    if (typeof obj === 'number') return '<span class="json-num">' + obj + '</span>';
    if (typeof obj === 'string') return '<span class="json-str">"' + esc(obj) + '"</span>';

    if (Array.isArray(obj)) {
        if (obj.length === 0) return '[]';
        var html = '[\n';
        obj.forEach(function(item, i) {
            html += next + jsonToHtml(item, indent + 1);
            if (i < obj.length - 1) html += ',';
            html += '\n';
        });
        return html + pad + ']';
    }

    var keys = Object.keys(obj);
    if (keys.length === 0) return '{}';
    var html = '{\n';
    keys.forEach(function(key, i) {
        html += next + '<span class="json-key">"' + esc(key) + '"</span>: ' + jsonToHtml(obj[key], indent + 1);
        if (i < keys.length - 1) html += ',';
        html += '\n';
    });
    return html + pad + '}';
}

function textToHtml(text) {
    var lines = text.split('\n');
    return lines.map(function(line, i) {
        return '<div class="line"><span class="line-num">' + (i + 1) + '</span>' + esc(line) + '</div>';
    }).join('');
}

function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ═══════════════════════════════════════════
// UI
// ═══════════════════════════════════════════
var currentRaw = '';
var currentFiltered = '';

var dropZone = document.getElementById('dropZone');
var fileInput = document.getElementById('fileInput');
var errorBox = document.getElementById('errorBox');
var fileInfo = document.getElementById('fileInfo');
var contentPanel = document.getElementById('contentPanel');
var contentPre = document.getElementById('contentPre');
var searchInput = document.getElementById('searchInput');
var stats = document.getElementById('stats');

dropZone.addEventListener('click', function() { fileInput.click(); });
dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
dropZone.addEventListener('drop', function(e) { e.preventDefault(); dropZone.classList.remove('drag-over'); if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', function() { if (fileInput.files[0]) processFile(fileInput.files[0]); });

async function processFile(file) {
    errorBox.style.display = 'none';

    if (!file.name.endsWith('.dat')) {
        showError('请选择 .dat 文件');
        return;
    }

    try {
        var buffer = await file.arrayBuffer();
        var text = await decryptFile(new Uint8Array(buffer));
        currentRaw = text;

        var formatted = formatContent(text);

        document.getElementById('fileName').textContent = file.name;
        document.getElementById('fileSize').textContent = formatSize(file.size) + ' · ' + text.split('\n').length + ' 行';
        var typeBadge = document.getElementById('fileType');
        typeBadge.textContent = formatted.type === 'json' ? 'JSON' : '文本';
        typeBadge.className = 'label ' + (formatted.type === 'json' ? 'label-danger' : 'label-primary');

        contentPre.innerHTML = formatted.html;
        currentFiltered = text;

        fileInfo.style.display = 'block';
        contentPanel.style.display = 'block';
        searchInput.value = '';

        updateStats(text);
    } catch (e) {
        showError(e.message);
    }
}

function showError(msg) {
    errorBox.textContent = '⚠ ' + msg;
    errorBox.style.display = 'block';
    fileInfo.style.display = 'none';
    contentPanel.style.display = 'none';
}

function updateStats(text) {
    var lines = text.split('\n');
    stats.textContent = '共 ' + lines.length + ' 行';
    if (currentFiltered !== text) {
        stats.textContent += ' · 过滤后 ' + currentFiltered.split('\n').length + ' 行';
    }
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
}

searchInput.addEventListener('input', function() {
    var q = searchInput.value.toLowerCase();
    if (!q) {
        currentFiltered = currentRaw;
        contentPre.innerHTML = formatContent(currentRaw).html;
        updateStats(currentRaw);
        return;
    }
    var lines = currentRaw.split('\n');
    var filtered = lines.filter(function(l) { return l.toLowerCase().indexOf(q) !== -1; });
    currentFiltered = filtered.join('\n');
    contentPre.innerHTML = textToHtml(currentFiltered);
    updateStats(currentRaw);
});

document.getElementById('copyBtn').addEventListener('click', function() {
    navigator.clipboard.writeText(currentFiltered);
    var btn = document.getElementById('copyBtn');
    var orig = btn.textContent;
    btn.textContent = '✅ 已复制';
    setTimeout(function() { btn.textContent = orig; }, 1500);
});

document.getElementById('clearBtn').addEventListener('click', function() {
    currentRaw = '';
    currentFiltered = '';
    fileInfo.style.display = 'none';
    contentPanel.style.display = 'none';
    errorBox.style.display = 'none';
    fileInput.value = '';
});
</script>
</body>
</html>
